<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <!-- Background with subtle border -->
  <rect width="200" height="80" fill="#F8F8F8" rx="2"/>

  <!-- Red band -->
  <rect x="0" y="12" width="200" height="56" fill="#A91D2E" rx="0"/>

  <!-- GREFUN Letters - Modern geometric style -->
  <g fill="#FFFFFF">
    <!-- G (reversed C with yellow square) -->
    <rect x="20" y="28" width="6" height="24" />
    <rect x="20" y="28" width="18" height="6" />
    <rect x="20" y="46" width="18" height="6" />
    <rect x="32" y="36" width="6" height="16" />
    <!-- Yellow accent square in G -->
    <rect x="26" y="36" width="6" height="6" fill="#F5A623"/>

    <!-- R -->
    <rect x="44" y="28" width="6" height="24" />
    <rect x="44" y="28" width="16" height="6" />
    <rect x="54" y="34" width="6" height="6" />
    <rect x="44" y="40" width="16" height="5" />
    <polygon points="50,45 50,52 56,52 62,52 56,45" />

    <!-- E -->
    <rect x="68" y="28" width="6" height="24" />
    <rect x="68" y="28" width="16" height="6" />
    <rect x="68" y="37" width="12" height="5" />
    <rect x="68" y="46" width="16" height="6" />

    <!-- F -->
    <rect x="90" y="28" width="6" height="24" />
    <rect x="90" y="28" width="16" height="6" />
    <rect x="90" y="37" width="12" height="5" />

    <!-- U -->
    <rect x="112" y="28" width="6" height="20" />
    <rect x="128" y="28" width="6" height="20" />
    <rect x="112" y="46" width="22" height="6" />

    <!-- N -->
    <rect x="140" y="28" width="6" height="24" />
    <rect x="160" y="28" width="6" height="24" />
    <polygon points="146,28 146,40 154,52 160,52 160,40 152,28" />
  </g>
</svg>
