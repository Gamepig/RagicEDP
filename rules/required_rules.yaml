# 必填欄位規則 (REQ-*)
# Version: 1.1.0
# Date: 2026-01-11
# 注意：使用實際 BigQuery 欄位名稱 (英文)

rules:
  # === 品牌表 (10) ===
  - id: REQ-001
    name: 品牌編號必填驗證
    type: validation
    category: required
    field: brand_code
    description: "品牌編號為必填"
    tables: ["10"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-002
    name: 品牌名稱必填驗證
    type: validation
    category: required
    field: brand_name
    description: "品牌名稱為必填"
    tables: ["10"]
    severity: high
    enabled: true
    auto_fixable: false

  # === 通路表 (20) ===
  - id: REQ-003
    name: 通路編號必填驗證
    type: validation
    category: required
    field: channel_code
    description: "通路編號為必填"
    tables: ["20"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-004
    name: 通路名稱必填驗證
    type: validation
    category: required
    field: channel_name
    description: "通路名稱為必填"
    tables: ["20"]
    severity: high
    enabled: true
    auto_fixable: false

  # REQ-005 已移除：通路表無 brand_code 欄位 (2026-01-09)

  # === 金流表 (30) ===
  - id: REQ-006
    name: 金流編號必填驗證
    type: validation
    category: required
    field: payment_code
    description: "金流編號為必填"
    tables: ["30"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-007
    name: 金流名稱必填驗證
    type: validation
    category: required
    field: payment_name
    description: "金流名稱為必填"
    tables: ["30"]
    severity: high
    enabled: true
    auto_fixable: false

  # === 物流表 (40) ===
  - id: REQ-008
    name: 物流編號必填驗證
    type: validation
    category: required
    field: logistics_code
    description: "物流編號為必填"
    tables: ["40"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-009
    name: 物流名稱必填驗證
    type: validation
    category: required
    field: logistics_name
    description: "物流名稱為必填"
    tables: ["40"]
    severity: high
    enabled: true
    auto_fixable: false

  # === 郵遞區號表 (41) ===
  - id: REQ-010
    name: 郵遞區號必填驗證
    type: validation
    category: required
    field: zipcode
    description: "郵遞區號為必填"
    tables: ["41"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-011
    name: 縣市必填驗證
    type: validation
    category: required
    field: city
    description: "縣市為必填"
    tables: ["41"]
    severity: high
    enabled: true
    auto_fixable: false

  # REQ-012 已移除：省轄市（嘉義市、新竹市）沒有鄉鎮區，district 可為空 (2026-01-09)

  # === 訂單表 (50) ===
  - id: REQ-013
    name: 訂單編號必填驗證
    type: validation
    category: required
    field: order_code
    description: "訂單編號為必填"
    tables: ["50"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-014
    name: 訂單日期必填驗證
    type: validation
    category: required
    field: order_date
    description: "訂單日期為必填"
    tables: ["50"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-015
    name: 訂單客戶編號必填驗證
    type: validation
    category: required
    field: customer_code
    description: "訂單的客戶編號為必填（未知客戶訂單仍有銷售統計價值）"
    tables: ["50"]
    severity: low  # 2026-01-12 降級：無客戶訂單僅佔 0.04%，不影響整體分析
    enabled: true
    auto_fixable: false
    note: "無客戶資訊的訂單仍保留用於銷售統計，標記為「未知客戶」"

  - id: REQ-016
    name: 訂單實收金額必填驗證
    type: validation
    category: required
    field: order_amount
    description: "訂單實收金額為必填"
    tables: ["50"]
    severity: high
    enabled: true
    auto_fixable: false

  # === 客戶表 (60) ===
  - id: REQ-017
    name: 客戶編號必填驗證
    type: validation
    category: required
    field: customer_code
    description: "客戶編號為必填"
    tables: ["60"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-018
    name: 客戶名稱必填驗證
    type: validation
    category: required
    field: customer_name
    description: "客戶名稱為必填"
    tables: ["60"]
    severity: high
    enabled: true
    auto_fixable: false

  # === 商品表 (70) ===
  - id: REQ-019
    name: 商品編號必填驗證
    type: validation
    category: required
    field: product_code
    description: "商品編號為必填"
    tables: ["70"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-020
    name: 商品名稱必填驗證
    type: validation
    category: required
    field: product_name
    description: "商品名稱為必填"
    tables: ["70"]
    severity: high
    enabled: true
    auto_fixable: false

  # REQ-021 已移除：商品表 brand_code 未提取到獨立欄位，
  # 品牌編號存於 JSON data $.品牌編號，由 View 處理 (2026-01-09)

  - id: REQ-022
    name: 商品單價必填驗證
    type: validation
    category: required
    field: price
    description: "商品單價為必填（贈品/活動商品除外）"
    tables: ["70"]
    severity: high
    enabled: true
    auto_fixable: false
    exclude_condition:
      field: product_name
      patterns: ["贈品", "活動贈品", "活動", "週年慶活動"]
    note: "2026-01-12 調整：排除贈品、活動商品、週年慶活動"

  # === 活動管理表 (80) ===
  - id: REQ-023
    name: 活動編號必填驗證
    type: validation
    category: required
    field: campaign_code
    description: "活動編號為必填"
    tables: ["80"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-024
    name: 活動名稱必填驗證
    type: validation
    category: required
    field: campaign_name
    description: "活動名稱為必填"
    tables: ["80"]
    severity: high
    enabled: true
    auto_fixable: false

  - id: REQ-025
    name: 活動開始日期必填驗證
    type: validation
    category: required
    field: start_date
    description: "活動開始日期為必填（長期/常態活動除外）"
    tables: ["80"]
    severity: low
    enabled: true
    auto_fixable: false
    exclude_condition:
      field: campaign_name
      patterns: ["補償", "試用", "試吃", "量販", "優惠", "老友", "新客", "買", "贈"]
    note: "2026-01-12 調整：長期/常態活動、買贈活動不需要開始日期"

  # REQ-026 已移除：長期/無期限活動的 end_date 可為空 (2026-01-09)

  # === 訂單明細表 (99) ===
  - id: REQ-027
    name: 訂單明細訂單編號必填驗證
    type: validation
    category: required
    field: order_code
    description: "訂單明細的訂單編號為必填"
    tables: ["99"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-028
    name: 訂單明細商品編號必填驗證
    type: validation
    category: required
    field: product_code
    description: "訂單明細的商品編號為必填"
    tables: ["99"]
    severity: critical
    enabled: true
    auto_fixable: false

  - id: REQ-029
    name: 訂單明細數量必填驗證
    type: validation
    category: required
    field: quantity
    description: "訂單明細的數量為必填"
    tables: ["99"]
    severity: high
    enabled: true
    auto_fixable: false

  - id: REQ-030
    name: 訂單明細單價必填驗證
    type: validation
    category: required
    field: unit_price
    description: "訂單明細的單價為必填（贈品/活動商品除外）"
    tables: ["99"]
    severity: high
    enabled: true
    auto_fixable: false
    exclude_condition:
      field: product_name
      patterns: ["贈品", "活動贈品", "活動"]
    note: "2026-01-12 調整：排除贈品及活動商品"

  - id: REQ-031
    name: 訂單明細小計必填驗證
    type: validation
    category: required
    field: subtotal
    description: "訂單明細的小計為必填"
    tables: ["99"]
    severity: high
    enabled: true
    auto_fixable: false

  # REQ-032 已移除：訂單明細的品牌編號由 View (view_customer_brand) 處理
  # 與 REQ-021 (商品表 brand_code) 決策一致
  # 停用日期：2026-01-11
