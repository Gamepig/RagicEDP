# 關聯規則 (ASSOC-*)
# Version: 1.1.0
# Date: 2026-01-11
# 注意：使用實際 BigQuery 欄位名稱 (英文)

rules:
  # ASSOC-001: 小計 = 單價 * 數量
  - id: ASSOC-001
    name: 小計計算驗證
    type: validation
    category: association
    field: subtotal
    rule: "subtotal = unit_price * quantity"
    tolerance: 1
    description: "訂單明細小計須等於單價乘以數量（容差 1 元）"
    tables: ["99"]
    severity: high
    enabled: true
    auto_fixable: false

  # ASSOC-002: 折扣 <= 小計
  - id: ASSOC-002
    name: 折扣上限驗證
    type: validation
    category: association
    field: discount
    rule: "discount <= subtotal"
    tolerance: 0
    description: "折扣金額不可大於小計"
    tables: ["99"]
    severity: high
    enabled: true
    auto_fixable: false

  # ASSOC-003: 實收 >= 0
  - id: ASSOC-003
    name: 訂單實收非負驗證
    type: validation
    category: association
    field: actual_amount
    rule: "actual_amount >= 0"
    tolerance: 0
    description: "訂單實收金額須大於等於 0"
    tables: ["50"]
    severity: critical
    enabled: true
    auto_fixable: false

  # ASSOC-004: 單價 >= 成本價
  - id: ASSOC-004
    name: 單價成本價比較驗證
    type: validation
    category: association
    field: unit_price
    rule: "unit_price >= cost_price"
    tolerance: 0
    description: "商品單價須大於等於成本價"
    tables: ["70"]
    severity: medium
    enabled: true
    auto_fixable: false

  # ASSOC-005: 明細小計合計 ≈ 訂單總額
  - id: ASSOC-005
    name: 訂單明細合計驗證
    type: validation
    category: association
    field: total_amount
    rule: "SUM(detail.subtotal) ≈ order.total_amount"
    tolerance: 10
    description: "訂單明細小計合計須接近訂單總額（容差 10 元）"
    tables: ["50", "99"]
    severity: high
    enabled: true
    auto_fixable: false

  # ASSOC-006: 淨額 = 小計 - 折扣
  - id: ASSOC-006
    name: 淨額計算驗證
    type: validation
    category: association
    field: net_amount
    rule: "net_amount = subtotal - discount"
    tolerance: 1
    description: "淨額須等於小計減折扣"
    tables: ["99"]
    severity: medium
    enabled: true
    auto_fixable: false

  # ASSOC-007: 稅額計算
  - id: ASSOC-007
    name: 稅額計算驗證
    type: validation
    category: association
    field: tax_amount
    rule: "tax_amount = pretax_amount * 0.05"
    tolerance: 1
    description: "稅額須為稅前金額的 5%"
    tables: ["50"]
    severity: medium
    enabled: true
    auto_fixable: false

  # ASSOC-008: 含稅總額
  - id: ASSOC-008
    name: 含稅總額計算驗證
    type: validation
    category: association
    field: total_with_tax
    rule: "total_with_tax = pretax_amount + tax_amount"
    tolerance: 1
    description: "含稅總額須等於稅前金額加稅額"
    tables: ["50"]
    severity: medium
    enabled: true
    auto_fixable: false

  # ASSOC-009: 運費合理性
  - id: ASSOC-009
    name: 運費比例合理性驗證
    type: validation
    category: association
    field: shipping_fee
    rule: "shipping_fee <= actual_amount * 0.2"
    tolerance: 0
    description: "運費不應超過訂單實收的 20%"
    tables: ["50"]
    severity: low
    enabled: true
    auto_fixable: false

  # ASSOC-010: 單品金額上限
  - id: ASSOC-010
    name: 單品小計上限驗證
    type: validation
    category: association
    field: subtotal
    rule: "subtotal <= actual_amount"
    tolerance: 0
    description: "單品小計不應超過整筆訂單實收"
    tables: ["99"]
    severity: medium
    enabled: true
    auto_fixable: false
