# 時序邏輯規則 (TEMP-*)
# Version: 1.1.0
# Date: 2026-01-11
# 注意：使用實際 BigQuery 欄位名稱 (英文)

rules:
  # TEMP-001: 訂單日期不可為未來
  - id: TEMP-001
    name: 訂單日期未來日期驗證
    type: validation
    category: temporal
    field: order_date
    rule: "order_date <= CURRENT_DATE"
    description: "訂單日期不可為未來日期"
    tables: ["50"]
    severity: high
    enabled: true
    auto_fixable: false

  # TEMP-002: 活動結束日期須 >= 開始日期
  - id: TEMP-002
    name: 活動日期順序驗證
    type: validation
    category: temporal
    field: end_date
    depends_on: start_date
    rule: "end_date >= start_date"
    description: "活動結束日期須晚於或等於開始日期"
    tables: ["80"]
    severity: high
    enabled: true
    auto_fixable: false

  # TEMP-003: 活動開始日期合理性
  - id: TEMP-003
    name: 活動開始日期合理性驗證
    type: validation
    category: temporal
    field: start_date
    rule: "start_date >= 2020-01-01"
    description: "活動開始日期須在 2020 年之後"
    tables: ["80"]
    severity: medium
    enabled: true
    auto_fixable: false

  # TEMP-004: 訂單日期合理性
  - id: TEMP-004
    name: 訂單日期合理性驗證
    type: validation
    category: temporal
    field: order_date
    rule: "order_date >= 2020-01-01"
    description: "訂單日期須在 2020 年之後"
    tables: ["50"]
    severity: medium
    enabled: true
    auto_fixable: false
