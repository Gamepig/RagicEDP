# 外鍵參照規則 (FK-*)
# Version: 1.1.0
# Date: 2026-01-11
# 注意：使用實際 BigQuery 表格與欄位名稱 (英文)

rules:
  # FK-001: 訂單表 -> 客戶表
  - id: FK-001
    name: 訂單客戶編號參照驗證
    type: validation
    category: fk
    field: customer_code
    ref_table: sheet_60_customer
    ref_field: customer_code
    description: "訂單的客戶編號須存在於客戶表"
    tables: ["50"]
    severity: high
    enabled: true
    auto_fixable: false

  # FK-002: 訂單明細表 -> 訂單表
  - id: FK-002
    name: 訂單明細訂單編號參照驗證
    type: validation
    category: fk
    field: order_code
    ref_table: sheet_50_order
    ref_field: order_code
    description: "訂單明細的訂單編號須存在於訂單表"
    tables: ["99"]
    severity: critical
    enabled: true
    auto_fixable: false

  # FK-003: 訂單明細表 -> 商品表
  - id: FK-003
    name: 訂單明細商品編號參照驗證
    type: validation
    category: fk
    field: product_code
    ref_table: sheet_70_product
    ref_field: product_code
    description: "訂單明細的商品編號須存在於商品表"
    tables: ["99"]
    severity: high
    enabled: true
    auto_fixable: false

  # FK-004: 訂單明細表 -> 品牌表
  - id: FK-004
    name: 訂單明細品牌編號參照驗證
    type: validation
    category: fk
    field: brand_code
    ref_table: sheet_10_brand
    ref_field: brand_code
    description: "訂單明細的品牌編號須存在於品牌表"
    tables: ["99"]
    severity: medium
    enabled: true
    auto_fixable: false

  # FK-007: 訂單表 -> 通路表
  - id: FK-007
    name: 訂單通路編號參照驗證
    type: validation
    category: fk
    field: channel_code
    ref_table: sheet_20_channel
    ref_field: channel_code
    description: "訂單的通路編號須存在於通路表"
    tables: ["50"]
    severity: medium
    enabled: true
    auto_fixable: false
