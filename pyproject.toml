[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragic-edp"
version = "0.1.0"
description = "Ragic ERP Data Platform - Automated data sync, cleaning, and analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RagicEDP Team"}
]

dependencies = [
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "google-cloud-bigquery>=3.0.0",
    "functions-framework>=3.0.0",
    "flask>=2.0.0",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "pyyaml>=6.0.3",
    # v2 新增依賴
    "httpx>=0.27.0",           # OpenRouter API 客戶端
    "pydantic>=2.5.0",         # 資料模型驗證
    "pydantic-settings>=2.1.0", # 環境變數配置
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ragic-edp"
Documentation = "https://github.com/yourusername/ragic-edp/wiki"
Repository = "https://github.com/yourusername/ragic-edp.git"
Issues = "https://github.com/yourusername/ragic-edp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "rules*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["_local/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires GCP connection)",
    "contract: Contract tests (API schema validation)",
    "slow: Slow tests (>5s execution time)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
