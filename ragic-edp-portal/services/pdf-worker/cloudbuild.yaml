steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-east1-docker.pkg.dev/$PROJECT_ID/ragic-edp/pdf-worker:$SHORT_SHA', '.']
    dir: 'ragic-edp-portal/services/pdf-worker'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-east1-docker.pkg.dev/$PROJECT_ID/ragic-edp/pdf-worker:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'pdf-worker'
      - '--image=asia-east1-docker.pkg.dev/$PROJECT_ID/ragic-edp/pdf-worker:$SHORT_SHA'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=5'
      - '--max-instances=3'
      - '--set-env-vars=PDF_WORKER_SECRET=$$PDF_WORKER_SECRET'

images:
  - 'asia-east1-docker.pkg.dev/$PROJECT_ID/ragic-edp/pdf-worker:$SHORT_SHA'
